<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lineage 2</title>
    <link rel="icon" type="image/x-icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400&family=Noto+Serif+KR:wght@400&display=swap">
</head>
<body>
    <viewport></viewport>
    <template id="asset-source-download">
        <a class="client-download">Client download</a>
    </template>
    <section class="loading-progress" hidden aria-label="Loading">
        <div>
            <progress max="1" value="0" aria-label="Loading progress"></progress>
            <p role="status" aria-live="polite"></p>
        </div>
    </section>
    <section class="gpu-error" role="alert">
        <main>
            <h1>GPU rendering is unavailable</h1>
            <p>The browser could not start WebGL 2. Fully close and restart your browser, then reopen this page.</p>
            <p>If this keeps happening, check that graphics acceleration is enabled in your browser settings and that your graphics drivers are up to date.</p>
        </main>
    </section>
</body>

<script type="application/javascript" src="client.bundle.js"></script>
</html>
